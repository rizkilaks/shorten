[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ratelimiter-demo"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "redis>=5.0",
  "httpx>=0.27",
  "aiosqlite>=0.20",
  "pydantic-settings>=2.3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.24",
  "ruff>=0.6",
  "mypy>=1.11",
]

[tool.setuptools.packages.find]
include = ["limiter*", "demo*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["limiter/tests", "demo/tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
exclude = [
  "limiter/tests/",
  "demo/tests/",
]

[[tool.mypy.overrides]]
module = "aiosqlite"
ignore_missing_imports = true
