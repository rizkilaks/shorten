name: Deploy

on:
  push:
    branches: [main]

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Pin VPS host key
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' '43.134.104.216 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIELZn+19PaND7kXpdlETDmUw6xivzfy/jgiWIKt4X3k7' >> ~/.ssh/known_hosts
      - name: Deploy to VPS
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          set -e
          umask 077
          trap 'rm -f ~/.ssh/deploy_key' EXIT
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/deploy_key
          # The server runs the forced command (scripts/ssh-deploy.sh). `false`
          # never runs when the key is locked; if the lock is misconfigured, the
          # job fails loudly instead of silently doing nothing.
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o LogLevel=ERROR ubuntu@43.134.104.216 false
      - name: Smoke check
        run: curl -sf https://rlshorten.duckdns.org/v1/health
