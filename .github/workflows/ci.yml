name: CI

on:
  push:
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Typecheck
        run: mypy limiter demo
      - name: Test
        run: pytest
      - name: Build images
        run: docker compose build
      - name: Compose smoke test
        run: |
          docker ps -aq --filter "ancestor=redis:7-alpine" | xargs -r docker rm -f
          docker compose up -d
          for i in $(seq 1 30); do
            curl -sf http://localhost:8080/v1/health && break
            sleep 1
          done
          curl -sf -X POST http://localhost:8080/shorten \
            -H 'Content-Type: application/json' \
            -d '{"url":"https://example.com/ci","user_id":"ci"}'
          curl -sf http://localhost:8080/recent
